<svg xmlns="http://www.w3.org/2000/svg" width="600" height="58" viewBox="0 0 600 58">
<style>
  .line { visibility:hidden; animation: show 16s linear infinite; }
  .reveal { animation: type 16s steps(22,end) infinite; }
  @keyframes show { 0%,24.99% { visibility:visible } 25%,100% { visibility:hidden } }
  @keyframes type { 0% { transform:scaleX(0) } 13%,100% { transform:scaleX(1) } }
  .first { visibility:visible }
  @media (prefers-reduced-motion:reduce) { .line,.reveal { animation:none !important } }
</style>
<rect x="1" y="1" width="598" height="56" rx="14" fill="#111827" stroke="#456482"/>
